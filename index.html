<html lang="en" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Abem Tadele — Full-Stack Engineer | WordPress, APIs & AI Automation</title>
    <meta name="description" content="Full-stack engineer specializing in custom WordPress & WooCommerce builds, Laravel REST APIs, and AI-powered workflow automation with n8n, Make and the OpenAI/Gemini APIs." />
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: ['Inter', 'ui-sans-serif', 'system-ui', 'sans-serif'],
              display: ['"Space Grotesk"', 'Inter', 'sans-serif'],
            },
          },
        },
      };
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
    <style>
      :root {
        --bg: #ffffff;
        --ink: #0f172a;
        --muted: #475569;
        --accent: #0f766e; /* teal-700 */
      }

      body {
        font-family: 'Inter', ui-sans-serif, system-ui, sans-serif;
        background-color: var(--bg);
        color: var(--ink);
        -webkit-font-smoothing: antialiased;
      }

      h1, h2, h3, h4, h5, h6 {
        font-family: 'Space Grotesk', 'Inter', sans-serif;
        letter-spacing: -0.01em;
      }

      /* Minimal scrollbar */
      ::-webkit-scrollbar {
        width: 10px;
      }
      ::-webkit-scrollbar-track {
        background: #f1f5f9;
      }
      ::-webkit-scrollbar-thumb {
        background-color: #cbd5e1;
        border-radius: 8px;
        border: 2px solid #f1f5f9;
      }
      ::-webkit-scrollbar-thumb:hover {
        background-color: #94a3b8;
      }

      /* For offsetting the fixed header when navigating to sections */
      html {
        scroll-padding-top: 5rem; /* Adjust based on your header's height */
      }
      
      /* Scroll Animation Classes */
      .fade-in-section {
        opacity: 0;
        transform: translateY(20px);
        transition: opacity 0.6s ease-out, transform 0.6s ease-out;
      }
      .fade-in-section.is-visible {
        opacity: 1;
        transform: translateY(0);
      }
    </style>
