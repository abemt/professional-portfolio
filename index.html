<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Abem T. | Full-Stack Developer</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
      :root {
        --bg-dark: #111827;
        --bg-light: #1f2937;
        --primary: #38bdf8; /* light blue */
        --secondary: #818cf8; /* indigo */
        --text-light: #f3f4f6;
        --text-dark: #9ca3af;
      }

      body {
        font-family: 'Poppins', sans-serif;
        background-color: var(--bg-dark);
        color: var(--text-light);
      }

      /* Animated Gradient Background */
      .gradient-bg {
        background: linear-gradient(-45deg, #111827, #1e3a8a, #312e81, #111827);
        background-size: 400% 400%;
        animation: gradient 15s ease infinite;
      }

      @keyframes gradient {
        0% {
          background-position: 0% 50%;
        }
        50% {
          background-position: 100% 50%;
        }
        100% {
          background-position: 0% 50%;
        }
      }

      /* Custom Scrollbar */
      ::-webkit-scrollbar {
        width: 8px;
      }
      ::-webkit-scrollbar-track {
        background: var(--bg-dark);
      }
      ::-webkit-scrollbar-thumb {
        background-color: var(--primary);
        border-radius: 10px;
        border: 2px solid var(--bg-dark);
      }
      ::-webkit-scrollbar-thumb:hover {
        background-color: var(--secondary);
      }

      /* For offsetting the fixed header when navigating to sections */
      html {
        scroll-padding-top: 5rem; /* Adjust based on your header's height */
      }
      
      /* Scroll Animation Classes */
      .fade-in-section {
        opacity: 0;
        transform: translateY(20px);
        transition: opacity 0.6s ease-out, transform 0.6s ease-out;
      }
      .fade-in-section.is-visible {
        opacity: 1;
        transform: translateY(0);
      }
    </style>

}

</html>
